name: Documentation
description: README, DESIGN.md, eval docs, or skill text
title: "[docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, or wrong in docs
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Which files change and what readers can do after
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How to confirm accuracy (links, command output, eval docs)
    validations:
      required: true
