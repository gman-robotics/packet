[project]
name = "packet-dl"
version = "0.1.0"
description = "Streaming, domain-agnostic document language understanding pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Ginter" }]
dependencies = [
  "pydantic>=2.7",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
inspector = ["pdf-inspector"]
docling = ["docling"]
ocr-mlx = ["mlx", "mlx-vlm", "huggingface_hub", "Pillow"]
ocr-paddle = ["paddleocr[doc-parser]", "paddlepaddle", "Pillow"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
packet = "packet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packet"]

[tool.hatch.build.targets.wheel.force-include]
"src/packet" = "packet"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "needs_network: test needs live network or external downloads",
  "needs_gpu: test needs GPU hardware",
  "needs_models: test needs real model weights (e.g. PACKET_REAL_SCAN_PDF)",
  "needs_ocr_extras: test needs optional OCR extras (Pillow / ocr-mlx / ocr-paddle)",
]
