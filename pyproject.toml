[project]
name = "packet-dl"
version = "0.1.0"
description = "Streaming, domain-agnostic document language understanding pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Ginter" }]
dependencies = [
  "pydantic>=2.7",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
inspector = ["pdf-inspector"]
docling = ["docling"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
packet = "packet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packet"]

[tool.hatch.build.targets.wheel.force-include]
"src/packet" = "packet"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
